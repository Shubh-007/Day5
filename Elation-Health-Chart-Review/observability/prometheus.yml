global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'elation-health'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

scrape_configs:
  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Elation Health Backend
  - job_name: 'elation-health'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Jaeger
  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:14269']

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # Docker metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']
